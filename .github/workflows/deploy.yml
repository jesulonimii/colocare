name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and type-check
        run: pnpm check

  build-and-push:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: recommender
            dockerfile: apps/recommender/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/colocare-${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/colocare-${{ matrix.name }}:main
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux]
    environment: production
    env:
      VPS_COMPOSE_FILE: ${{ vars.VPS_COMPOSE_FILE }}
    steps:
      - uses: actions/checkout@v4

      - name: Update the production compose file
        run: |
          test -n "$VPS_COMPOSE_FILE"
          install -D -m 644 compose.prod.yml "$VPS_COMPOSE_FILE"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull, migrate, and start the stack
        env:
          API_IMAGE: ${{ env.IMAGE_PREFIX }}/colocare-api:${{ github.sha }}
          WEB_IMAGE: ${{ env.IMAGE_PREFIX }}/colocare-web:${{ github.sha }}
          RECOMMENDER_IMAGE: ${{ env.IMAGE_PREFIX }}/colocare-recommender:${{ github.sha }}
        run: |
          docker compose -f "$VPS_COMPOSE_FILE" pull
          docker compose -f "$VPS_COMPOSE_FILE" up -d database redis recommender
          docker compose -f "$VPS_COMPOSE_FILE" run --rm api node dist/database/migrate.js
          docker compose -f "$VPS_COMPOSE_FILE" up -d --remove-orphans
