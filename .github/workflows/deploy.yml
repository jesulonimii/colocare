name: 🚀 Build and Deploy

on:
    push:
        branches: [main]

permissions:
    contents: read
    packages: write

concurrency:
    group: production-deploy
    cancel-in-progress: false

env:
    GHCR_OWNER: ${{ github.repository_owner }}
    IMAGE_PREFIX: colocare
    IMAGE_TAG: main
    STACK_NAME: colocare

jobs:
    lint-and-typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint and type-check
              run: pnpm check

    build-and-push:
        needs: lint-and-typecheck
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - name: api
                      dockerfile: apps/api/Dockerfile
                    - name: web
                      dockerfile: apps/web/Dockerfile
                    - name: recommender
                      dockerfile: apps/recommender/Dockerfile
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push ${{ matrix.name }}
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  push: true
                  tags: ghcr.io/${{ env.GHCR_OWNER }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ env.IMAGE_TAG }}
                  cache-from: type=gha,scope=${{ matrix.name }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.name }}

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Pull, migrate, and restart the built services
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: ${{ secrets.VPS_PORT }}
                  envs: GHCR_TOKEN,GHCR_USER,STACK_NAME
                  script: |
                      set -euo pipefail

                      echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

                      cd /home/devops/apps

                      just stacks "$STACK_NAME" api --pull
                      just stacks "$STACK_NAME" web --pull
                      just stacks "$STACK_NAME" recommender --pull

                      just stacks "$STACK_NAME" api --run "node --run migrate"

                      just stacks "$STACK_NAME" api --restart
                      just stacks "$STACK_NAME" web --restart
                      just stacks "$STACK_NAME" recommender --restart
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GHCR_USER: ${{ github.actor }}
                  STACK_NAME: ${{ env.STACK_NAME }}
