services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: colocare
      POSTGRES_USER: colocare
      POSTGRES_PASSWORD: colocare
    volumes:
      - postgres18_cluster_data:/var/lib/postgresql
  recommender:
    build:
      context: .
      dockerfile: apps/recommender/Dockerfile
  api:
    image: colocare-api-prod
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://colocare:colocare@database:5432/colocare
      RECOMMENDER_URL: http://recommender:8000
      JWT_SECRET: change-this-production-secret
    depends_on:
      - database
      - recommender
  web:
    image: colocare-web-prod
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres18_cluster_data:
