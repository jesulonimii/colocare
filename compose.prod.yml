services:
    database:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: colocare
            POSTGRES_USER: colocare
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - postgres18_cluster_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U colocare -d colocare"]
            interval: 3s
            timeout: 3s
            retries: 10

    redis:
        image: redis:7-alpine

    recommender:
        image: ghcr.io/jesulonimii/colocare-recommender:main

    api:
        image: ghcr.io/jesulonimii/colocare-api:main
        ports:
            - "3001:80"
        environment:
            DATABASE_URL: postgres://colocare:${POSTGRES_PASSWORD}@database:5432/colocare
            RECOMMENDER_URL: http://recommender:80
            REDIS_HOST: redis
            JWT_SECRET: ${JWT_SECRET}
        depends_on:
            database:
                condition: service_healthy
            recommender:
                condition: service_started
            redis:
                condition: service_started
    web:
        image: ghcr.io/jesulonimii/colocare-web:main
        ports:
            - "8080:80"
        depends_on:
            - api

volumes:
    postgres18_cluster_data:
